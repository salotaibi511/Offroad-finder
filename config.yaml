# ============================================================
#  إعدادات نظام البحث عن سيارة البر — عدّل هنا فقط
# ============================================================

# --- المواصفات والفلاتر الإلزامية (أي عرض يخالفها يُصنَّف "مستبعد") ---
requirements:
  max_price: 20000          # أقصى سعر بالريال
  min_year: 1990            # أقدم موديل مقبول
  good_mileage_km: 250000   # ممشى يعتبر ممتازًا لهذه الفئة السعرية
  max_mileage_km: 450000    # أقصى ممشى مقبول (اتركه كبيرًا إذا غير مهم)
  require_4x4: true         # استبعاد ما ثبت أنه غير دبل
  exclude_parts_cars: true  # استبعاد سيارات التشليح/قطع الغيار
  home_city: جدة
  min_plausible_price: 5000  # أقل من هذا = غالبًا قطعة/إكسسوار

# --- الموديلات المستهدفة: الوزن = مدى ملاءمتها للبر والصخور (0 إلى 1) ---
# aliases = الكلمات التي يكتبها الناس في حراج للإشارة للموديل
# max_year = آخر موديل يُتوقع أن يكون ضمن الميزانية؛ الأحدث منه يُستبعد إذا لم يُذكر السعر (تقدير أولي — عدّله)
models:
  land_cruiser:  {name: "تويوتا لاندكروزر", fit: 1.00, max_year: 2006, aliases: ["لاندكروزر", "لاند كروزر", "landcruiser", "land cruiser", "جيب تويوتا", "تويوتا جيب", "جكسار", "جي اكس ار", "gxr", "vxr"]}
  lc70:          {name: "تويوتا شاص/ربع (70)", fit: 1.00, max_year: 2008, aliases: ["شاص", "ربع", "lc70", "lc79", "lc76", "بك اب لاندكروزر"]}
  prado:         {name: "تويوتا برادو", fit: 0.90, max_year: 2007, aliases: ["برادو", "prado"]}
  fj:            {name: "تويوتا اف جي", fit: 0.95, max_year: 2009, aliases: ["اف جي", "إف جي", "fj", "fj cruiser"]}
  hilux:         {name: "تويوتا هايلكس", fit: 0.90, max_year: 2010, aliases: ["هايلكس", "هيلكس", "هايلوكس", "hilux"]}
  fourrunner:    {name: "تويوتا فورنر", fit: 0.85, max_year: 2006, aliases: ["فورنر", "فور رنر", "4runner", "4 رنر"]}
  patrol:        {name: "نيسان باترول", fit: 0.95, max_year: 2006, aliases: ["باترول", "patrol", "سفاري", "safari", "دورية"]}
  nissan_pickup: {name: "نيسان دبل/نافارا", fit: 0.80, max_year: 2012, aliases: ["نافارا", "navara", "ددسن", "داتسون", "نيسان دبل", "دبل نيسان"]}
  pajero:        {name: "ميتسوبيشي باجيرو", fit: 0.85, max_year: 2010, aliases: ["باجيرو", "pajero", "مونتيرو"]}
  l200:          {name: "ميتسوبيشي L200", fit: 0.75, max_year: 2012, aliases: ["l200", "ال 200", "ل200"]}
  jimny:         {name: "سوزوكي جمني", fit: 0.85, max_year: 2014, aliases: ["جمني", "جيمني", "jimny"]}
  vitara:        {name: "سوزوكي فيتارا", fit: 0.60, max_year: 2012, aliases: ["فيتارا", "vitara"]}
  wrangler:      {name: "جيب رانجلر", fit: 0.85, max_year: 2008, aliases: ["رانجلر", "رنجلر", "wrangler"]}
  cherokee:      {name: "جيب شيروكي", fit: 0.60, max_year: 2012, aliases: ["شيروكي", "cherokee"]}
  dmax:          {name: "ايسوزو ديماكس", fit: 0.75, max_year: 2014, aliases: ["ديماكس", "دي ماكس", "d-max", "dmax"]}
  ranger:        {name: "فورد رينجر", fit: 0.70, max_year: 2014, aliases: ["رينجر", "رانجر", "ranger"]}
  lexus_lx_gx:   {name: "لكزس LX/GX", fit: 0.85, max_year: 2005, aliases: ["lx470", "lx 470", "gx470", "gx 470", "لكزس ال اكس", "لكزس جي اكس"]}
  galloper:      {name: "هيونداي جالوبر", fit: 0.70, max_year: 2005, aliases: ["جالوبر", "galloper"]}
  trooper:       {name: "ايسوزو تروبر", fit: 0.75, max_year: 2003, aliases: ["تروبر", "trooper"]}
  pathfinder:    {name: "نيسان باثفايندر", fit: 0.70, max_year: 2008, aliases: ["باثفايندر", "باث فايندر", "pathfinder"]}
  xterra:        {name: "نيسان اكستيرا", fit: 0.75, max_year: 2010, aliases: ["اكستيرا", "اكس تيرا", "xterra"]}
  grand_cherokee: {name: "جيب جراند شيروكي", fit: 0.65, max_year: 2008, aliases: ["جراند شيروكي", "قراند شيروكي", "grand cherokee"]}
  tahoe_yukon:   {name: "تاهو/يوكن/سوبربان", fit: 0.45, max_year: 2008, aliases: ["تاهو", "يوكن", "سوبربان", "tahoe", "yukon", "suburban"]}

# --- أوزان التقييم (المجموع 100) ---
weights:
  price_value: 30   # السعر مقارنة بالسوق/الميزانية
  model_fit: 20     # ملاءمة الموديل للبر
  condition: 15     # إشارات الحالة (حوادث، ماكينة، فحص...)
  mileage: 15
  year: 10
  distance: 10      # القرب من جدة

# حدود التصنيف
labels:
  opportunity: 70   # 🟢 فرصة
  worth_asking: 50  # 🟡 يستحق السؤال  (أقل من ذلك = ضعيف)

# --- مصادر البحث التلقائي ---
sources:
  haraj:
    enabled: true
    # المدن (بأسماء حراج): يُبحث عن كل كلمة في كل مدينة. اتركها [""] للبحث في كل المملكة
    cities: [""]   # كل المملكة
    # كلمات البحث (كل كلمة = صفحة بحث في حراج)
    queries:
      - "لاندكروزر"
      - "شاص"
      - "ربع تويوتا"
      - "هايلكس دبل"
      - "اف جي"
      - "برادو"
      - "باترول"
      - "سفاري نيسان"
      - "باجيرو"
      - "جمني"
      - "نافارا دبل"
      - "ديماكس دبل"
      - "سيارة برية"
      - "جيب دبل"
      - "جالوبر"
      - "تروبر"
      - "باثفايندر"
      - "اكستيرا"
      - "ددسن دبل"
      - "جراند شيروكي"
      - "فيتارا"
      - "باجيرو 2005"
      - "باترول 99"
      - "لاندكروزر 97"
      - "شاص 2000"
      - "هايلكس قديم"
    # جلب صفحة كل إعلان جديد لاستخراج السعر والممشى والوصف (أدق لكن أبطأ)
    fetch_details: true
    max_details_per_run: 120
    delay_seconds: 2.5
  extra_search_urls: []   # روابط بحث من مواقع أخرى (السوق المفتوح، يلا موتور، موتري...) — تُضاف هنا أو عبر نموذج "أضف عرض"

# --- الذكاء الاصطناعي (اختياري: يعمل فقط إذا أُضيف ANTHROPIC_API_KEY في Secrets) ---
llm:
  enabled: true
  model: claude-haiku-5-5
  max_per_run: 40

# --- التنبيهات (اختياري: TELEGRAM_BOT_TOKEN و TELEGRAM_CHAT_ID في Secrets) ---
notify:
  telegram: true
  min_score: 70          # أرسل تنبيه للعروض بهذه الدرجة أو أعلى
  price_drop: true       # تنبيه عند نزول سعر عرض جيد

# مدة الاحتفاظ بالعروض غير المحدّثة قبل أرشفتها
archive_after_days: 45
