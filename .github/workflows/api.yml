name: تحديثات الموقع

# يُشغَّل من الموقع (عبر جسر Google Apps Script) عند إضافة رابط أو تعديل عرض
on:
  workflow_dispatch:
    inputs:
      reason:
        description: "سبب التشغيل"
        required: false
        default: "web"

permissions:
  contents: write

concurrency:
  group: data-write
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install requests beautifulsoup4 PyYAML
      - name: Apply edits and new links
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/apply_edits.py
      - name: Save data
        run: |
          git config user.name "offroad-bot"
          git config user.email "offroad-bot@users.noreply.github.com"
          git add docs/data/listings.json
          git diff --cached --quiet && exit 0
          git commit -m "تحديث من الموقع"
          for i in 1 2 3 4; do git pull --rebase -X theirs && git push && exit 0; sleep 5; done; exit 1
