name: فحص الجسر

on:
  workflow_dispatch:
    inputs:
      add_url:
        description: "رابط تجربة إضافة (اختياري)"
        required: false
        default: ""

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - env:
          ADD: ${{ inputs.add_url }}
        run: |
          U="https://script.google.com/macros/s/AKfycby-O7s8Z2iBiNa5yfAPUw_KiQBlq8O2OJN_omxcWNxm0Sy9TgqNGZrq6b7clZsPRcyz/exec"
          echo "== ping";   curl -sL "$U?action=ping" | head -c 300; echo
          echo "== cors";   curl -sL -D - -o /dev/null -H "Origin: https://salotaibi511.github.io" "$U?action=ping" | grep -i "access-control" || true
          if [ -n "$ADD" ]; then
            echo "== add"
            curl -sL -H "Content-Type: text/plain;charset=UTF-8" --data "{\"action\":\"add\",\"urls\":\"$ADD\",\"by\":\"فحص\"}" "$U" | head -c 400; echo
          fi
