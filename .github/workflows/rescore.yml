name: إعادة التقييم بعد تعديل المواصفات

on:
  push:
    paths: ["config.yaml", "finder/**"]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: data-write
  cancel-in-progress: false

jobs:
  rescore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q tests
      - run: python scripts/rescore.py
      - run: |
          git config user.name "offroad-bot"
          git config user.email "offroad-bot@users.noreply.github.com"
          git add docs/data
          git diff --cached --quiet && exit 0
          git commit -m "إعادة التقييم"
          git pull --rebase -X theirs && git push
