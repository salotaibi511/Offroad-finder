name: البحث التلقائي

on:
  schedule:
    - cron: "17 * * * *"   # كل ساعة
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: data-write
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Install browser (fallback for blocked/JS pages)
        run: python -m playwright install --with-deps chromium
      - name: Collect
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/collect.py
      - name: Save data
        if: always()
        run: |
          git config user.name "offroad-bot"
          git config user.email "offroad-bot@users.noreply.github.com"
          git add docs/data
          git diff --cached --quiet && exit 0
          git commit -m "تحديث العروض $(date -u +%F' '%H:%M)"
          git pull --rebase -X theirs && git push
